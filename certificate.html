<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Verification | Ikaisoft Consultancy Services</title>
  <link rel="shortcut icon" href="assets/img/ikaisoft-favicon.png" type="image/x-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

  <style>
    :root {
      color-scheme: light;
      --font-heading: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      --primary: #144a21;
      --primary-light: #1b5e2b;
      --primary-dark: #0d3816;
      --accent: #22c55e;
      --accent-glow: rgba(34, 197, 94, 0.2);
      --bg-page: #f0f7f1;
      --card-bg: #ffffff;
      --border-color: #d6e8d8;
      --text-main: #0f2a18;
      --text-muted: #526b58;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-body);
      background: radial-gradient(circle at 50% 0%, #e2f2e4 0%, #f0f7f1 50%, #d8ebd9 100%);
      color: var(--text-main);
      padding: 24px 16px;
    }

    #certificate-root {
      width: min(100%, 1020px);
      margin: 0 auto;
    }

    /* Verification Box Styles */
    .verify-wrapper {
      max-width: 520px;
      margin: 0 auto;
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 44px 38px;
      box-shadow: 0 25px 60px rgba(15, 42, 24, 0.08);
      position: relative;
      overflow: hidden;
      text-align: center;
      animation: fadeIn 0.4s ease;
    }
    .verify-wrapper::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 6px;
      background: linear-gradient(90deg, #144a21, #22c55e, #144a21);
    }
    .verify-icon-bubble {
      width: 76px;
      height: 76px;
      border-radius: 22px;
      background: #eef7ee;
      border: 1px solid #d2ebd4;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      color: var(--primary);
      margin-bottom: 20px;
      box-shadow: 0 10px 24px var(--accent-glow);
    }
    .verify-title {
      font-family: var(--font-heading);
      font-size: 26px;
      font-weight: 700;
      color: var(--primary-dark);
      margin: 0 0 8px;
      letter-spacing: -0.02em;
    }
    .verify-subtitle {
      font-size: 14.5px;
      line-height: 1.6;
      color: var(--text-muted);
      margin: 0 0 24px;
    }
    .cert-id-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #eaf5eb;
      border: 1px solid #cce8ce;
      padding: 8px 18px;
      border-radius: 999px;
      font-size: 13.5px;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 24px;
      font-family: monospace;
      letter-spacing: 0.04em;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 7px;
      letter-spacing: 0.02em;
    }
    .input-with-icon {
      position: relative;
    }
    .input-with-icon i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #7b9482;
      font-size: 16px;
    }
    .input-with-icon input {
      width: 100%;
      padding: 14px 16px 14px 44px;
      border: 1.5px solid #d1e5d3;
      border-radius: 14px;
      font-size: 15px;
      font-family: inherit;
      color: var(--text-main);
      background: #fafdfa;
      transition: all 0.2s ease;
      outline: none;
    }
    .input-with-icon input:focus {
      border-color: var(--primary);
      background: white;
      box-shadow: 0 0 0 4px rgba(20, 74, 33, 0.12);
    }
    .verify-btn {
      width: 100%;
      border: none;
      border-radius: 14px;
      padding: 15px 24px;
      font-size: 15.5px;
      font-weight: 700;
      font-family: var(--font-heading);
      background: var(--primary);
      color: white;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 14px 28px rgba(20, 74, 33, 0.22);
      transition: all 0.2s ease;
    }
    .verify-btn:hover:not(:disabled) {
      background: var(--primary-light);
      transform: translateY(-2px);
      box-shadow: 0 18px 32px rgba(20, 74, 33, 0.28);
    }
    .verify-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
      transform: none;
    }
    .verify-alert {
      display: none;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 13.5px;
      margin-top: 18px;
      text-align: left;
      line-height: 1.5;
    }
    .verify-alert.error {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: var(--danger-bg);
      border: 1px solid var(--danger-border);
      color: #991b1b;
    }
    .verify-alert.info {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
    }
    .brand-footnote {
      margin-top: 24px;
      font-size: 12px;
      color: #829a88;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Multi-certificate Bar */
    .multi-cert-container {
      background: white;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 18px 24px;
      margin-bottom: 24px;
      box-shadow: 0 10px 30px rgba(15, 42, 24, 0.05);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }
    .multi-cert-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .multi-cert-avatar {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: #eef7ee;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }
    .multi-cert-text h4 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-dark);
    }
    .multi-cert-text p {
      margin: 3px 0 0;
      font-size: 13px;
      color: var(--text-muted);
    }
    .cert-tabs-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .cert-tab-btn {
      border: 1.5px solid var(--border-color);
      background: #f8faf8;
      border-radius: 12px;
      padding: 8px 16px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .cert-tab-btn:hover {
      background: #eef7ee;
      border-color: var(--primary);
    }
    .cert-tab-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 4px 14px rgba(20, 74, 33, 0.2);
    }

    /* Certificate Card Styles */
    .certificate-card {
      background: white;
      border: 1.5px solid var(--border-color);
      border-radius: 28px;
      box-shadow: 0 35px 80px rgba(15, 31, 17, 0.12);
      overflow: hidden;
      position: relative;
      animation: fadeIn 0.4s ease;
    }
    .certificate-inner {
      padding: 44px 48px 36px;
      display: grid;
      gap: 32px;
    }
    .certificate-header {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      border-bottom: 2px solid #edf5ed;
      padding-bottom: 24px;
    }
    .logo-block {
      display: flex;
      gap: 14px;
      align-items: center;
    }
    .logo-block img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 18px;
      background: #eef6ec;
      padding: 10px;
      border: 1px solid #d5e8d5;
    }
    .logo-block .brand {
      display: grid;
      gap: 4px;
    }
    .brand-title {
      font-family: var(--font-heading);
      font-size: 24px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--primary-dark);
      margin: 0;
    }
    .brand-subtitle {
      margin: 0;
      color: var(--text-muted);
      font-size: 13px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 600;
    }
    .certificate-title-box {
      text-align: right;
    }
    .cert-badge-verified {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #e6f9ed;
      border: 1px solid #b7ecc8;
      color: #15803d;
      padding: 5px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 6px;
    }
    .certificate-title {
      font-family: var(--font-heading);
      font-size: 20px;
      color: var(--primary-dark);
      text-transform: uppercase;
      letter-spacing: 0.18em;
      font-weight: 700;
      margin: 0;
    }
    .certificate-body {
      display: grid;
      gap: 28px;
    }
    .recipient-section {
      text-align: left;
    }
    .recipient-section .pre-title {
      font-size: 15px;
      color: var(--text-muted);
      margin: 0 0 10px;
      font-style: italic;
    }
    .recipient-section h1 {
      margin: 0;
      font-family: var(--font-heading);
      font-size: clamp(2.6rem, 3.8vw, 4.2rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      color: var(--primary-dark);
      font-weight: 800;
    }
    .recipient-section .post-title {
      margin: 12px 0 0;
      font-size: 16px;
      line-height: 1.7;
      color: var(--text-muted);
      max-width: 820px;
    }
    .recipient-section .post-title strong {
      color: var(--primary-dark);
    }
    .details-grid {
      display: grid;
      gap: 16px;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      align-items: stretch;
    }
    .detail-card {
      background: #f8faf8;
      padding: 18px 20px;
      border-radius: 18px;
      border: 1px solid #e2efe4;
    }
    .detail-card label {
      display: block;
      font-size: 11.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      letter-spacing: 0.14em;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .detail-card .value {
      margin: 0;
      font-size: 1.05rem;
      color: var(--text-main);
      font-weight: 700;
      line-height: 1.4;
      word-break: break-all;
    }
    .certificate-qr-card {
      background: #f8faf8;
      padding: 16px 20px;
      border-radius: 18px;
      border: 1px solid #e2efe4;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .certificate-qr-card img {
      width: 96px;
      height: 96px;
      border-radius: 14px;
      border: 1px solid #d5e5d7;
      background: white;
      padding: 6px;
      object-fit: contain;
    }
    .qr-info p {
      margin: 0;
      font-size: 13px;
      font-weight: 600;
      color: var(--primary-dark);
    }
    .qr-info span {
      display: block;
      margin-top: 4px;
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .certificate-footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      padding-top: 20px;
      border-top: 1px solid #e5eee3;
      flex-wrap: wrap;
    }
    .security-note {
      color: var(--text-muted);
      font-size: 12.5px;
      max-width: 540px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .button {
      border: none;
      border-radius: 14px;
      padding: 13px 22px;
      font-size: 14.5px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .button.primary {
      background: var(--primary);
      color: white;
      box-shadow: 0 14px 26px rgba(20, 74, 33, 0.18);
    }
    .button.primary:hover {
      background: var(--primary-light);
      transform: translateY(-1px);
    }
    .button.secondary {
      background: #f1f6f2;
      color: var(--primary);
      border: 1px solid #d4e6d6;
    }
    .button.secondary:hover {
      background: #e4efe5;
      transform: translateY(-1px);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media print {
      body {
        background: white !important;
        padding: 0 !important;
      }
      .multi-cert-container, .actions, .brand-footnote, #reverifyBtn {
        display: none !important;
      }
      .certificate-card {
        border: none !important;
        box-shadow: none !important;
      }
    }

    @media (max-width: 768px) {
      .certificate-inner {
        padding: 28px 20px;
      }
      .certificate-header {
        flex-direction: column;
        align-items: flex-start;
      }
      .certificate-title-box {
        text-align: left;
      }
      .verify-wrapper {
        padding: 32px 20px;
      }
      .multi-cert-container {
        flex-direction: column;
        align-items: flex-start;
      }
      .actions {
        width: 100%;
      }
      .actions .button {
        flex: 1;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div id="certificate-root"></div>

  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const certificateNumberParam = (params.get('id') || params.get('certificateNumber') || '').trim();
    const emailParam = (params.get('email') || '').trim();
    const root = document.getElementById('certificate-root');

    const isLocalhost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' || window.location.hostname === '';
    const API_BASE = window.location.protocol === 'file:' || isLocalhost
      ? 'http://localhost:5000'
      : (window.location.hostname === 'ikaisoft.com' || window.location.hostname === 'www.ikaisoft.com')
        ? 'https://ikaisoft-website-backend.onrender.com'
        : window.location.origin;

    let verifiedCertificates = [];
    let currentCertificateIndex = 0;
    let verifiedEmail = emailParam || '';

    function escapeHTML(value) {
      return String(value || '').replace(/[&<>'"]/g, (c) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[c]));
    }

    function formatDate(value) {
      if (!value) return 'N/A';
      try {
        const date = new Date(value);
        return new Intl.DateTimeFormat('en-GB', { day: '2-digit', month: 'long', year: 'numeric' }).format(date);
      } catch (e) {
        return 'N/A';
      }
    }

    function renderVerificationScreen(errorMsg = '') {
      root.innerHTML = `
        <div class="verify-wrapper">
          <div class="verify-icon-bubble">
            <i class="fa-solid fa-shield-halved"></i>
          </div>
          <h2 class="verify-title">Certificate Verification</h2>
          <p class="verify-subtitle">
            Enter your Certificate Number and registered student email address below to verify authenticity and access your certificate.
          </p>

          <form id="verifyForm">
            <div class="form-group">
              <label for="inputCertId"><i class="fa-solid fa-id-card"></i> Certificate Number *</label>
              <div class="input-with-icon">
                <i class="fa-solid fa-certificate"></i>
                <input 
                  type="text" 
                  id="inputCertId" 
                  placeholder="e.g. ICS-2026-000001" 
                  required 
                  autocomplete="off"
                  value="${escapeHTML(certificateNumberParam)}"
                >
              </div>
            </div>

            <div class="form-group">
              <label for="inputEmail"><i class="fa-solid fa-envelope"></i> Registered Email Address *</label>
              <div class="input-with-icon">
                <i class="fa-solid fa-at"></i>
                <input 
                  type="email" 
                  id="inputEmail" 
                  placeholder="e.g. name@gmail.com" 
                  required 
                  autocomplete="email" 
                  value="${escapeHTML(verifiedEmail)}"
                >
              </div>
            </div>

            <button type="submit" id="submitVerifyBtn" class="verify-btn">
              <i class="fa-solid fa-key"></i>
              <span>Verify & View Certificate</span>
            </button>
          </form>

          <div id="verifyAlert" class="verify-alert error" style="${errorMsg ? 'display:flex;' : 'display:none;'}">
            <i class="fa-solid fa-circle-exclamation" style="font-size:18px; margin-top:2px;"></i>
            <span id="verifyAlertText">${escapeHTML(errorMsg)}</span>
          </div>

          <div class="brand-footnote">
            <i class="fa-solid fa-lock"></i>
            <span>Official digital verification by Ikaisoft Consultancy Services</span>
          </div>
        </div>
      `;

      const form = document.getElementById('verifyForm');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const certId = (document.getElementById('inputCertId')?.value || certificateNumberParam || '').trim();
        const email = (document.getElementById('inputEmail')?.value || '').trim();

        if (!certId) {
          showAlert('Please enter your certificate number (e.g. ICS-2026-000001).');
          return;
        }
        if (!email) {
          showAlert('Please enter the registered student email address.');
          return;
        }

        await verifyAndLoadCertificate(certId, email);
      });
    }

    function showAlert(message) {
      const alertBox = document.getElementById('verifyAlert');
      const alertText = document.getElementById('verifyAlertText');
      if (alertBox && alertText) {
        alertText.textContent = message;
        alertBox.style.display = 'flex';
      }
    }

    async function verifyAndLoadCertificate(certId, email) {
      const btn = document.getElementById('submitVerifyBtn');
      if (btn) {
        btn.disabled = true;
        btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> <span>Verifying credentials...</span>`;
      }

      try {
        const resp = await fetch(`${API_BASE}/api/certificate/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ certificateNumber: certId, email: email })
        });

        const result = await resp.json().catch(() => ({}));

        if (!resp.ok || !result.success) {
          if (btn) {
            btn.disabled = false;
            btn.innerHTML = `<i class="fa-solid fa-key"></i> <span>Verify & View Certificate</span>`;
          }
          showAlert(result.message || 'Email does not match this certificate record. Please check and try again.');
          return;
        }

        verifiedEmail = email;
        verifiedCertificates = result.certificates && result.certificates.length > 0
          ? result.certificates
          : [result.data];

        // Find current certificate matching certId
        const matchIndex = verifiedCertificates.findIndex(
          (c) => String(c.certificateNumber).toLowerCase() === String(certId).toLowerCase()
        );
        currentCertificateIndex = matchIndex >= 0 ? matchIndex : 0;

        renderCertificateDashboard();

      } catch (err) {
        if (btn) {
          btn.disabled = false;
          btn.innerHTML = `<i class="fa-solid fa-key"></i> <span>Verify & View Certificate</span>`;
        }
        showAlert('Network or server error while verifying certificate. Please try again.');
      }
    }

    function renderCertificateDashboard() {
      const current = verifiedCertificates[currentCertificateIndex] || verifiedCertificates[0];
      if (!current) {
        renderVerificationScreen('No certificate record found.');
        return;
      }

      const qrUrl = `${API_BASE}/api/certificate/qr`;
      let downloadUrl = current.pdfUrl;
      if (downloadUrl && downloadUrl.startsWith('/')) {
        downloadUrl = `${API_BASE}${downloadUrl}`;
      }
      if (!downloadUrl) {
        downloadUrl = `${API_BASE}/api/certificates/public/${encodeURIComponent(current.certificateNumber)}/download?email=${encodeURIComponent(verifiedEmail)}`;
      }

      let multiCertBarHtml = '';
      if (verifiedCertificates.length > 1) {
        multiCertBarHtml = `
          <div class="multi-cert-container">
            <div class="multi-cert-info">
              <div class="multi-cert-avatar">
                <i class="fa-solid fa-user-graduate"></i>
              </div>
              <div class="multi-cert-text">
                <h4>${escapeHTML(current.studentName)}'s Certificates</h4>
                <p>${verifiedCertificates.length} verified certificates linked to <strong>${escapeHTML(verifiedEmail)}</strong></p>
              </div>
            </div>
            <div class="cert-tabs-row">
              ${verifiedCertificates.map((cert, idx) => `
                <button class="cert-tab-btn ${idx === currentCertificateIndex ? 'active' : ''}" data-index="${idx}">
                  <i class="fa-solid fa-award"></i>
                  <span>${escapeHTML(cert.courseName || 'Course')} (${escapeHTML(cert.certificateNumber)})</span>
                </button>
              `).join('')}
            </div>
          </div>
        `;
      }

      root.innerHTML = `
        <div>
          ${multiCertBarHtml}

          <div class="certificate-card">
            <div class="certificate-inner">
              <div class="certificate-header">
                <div class="logo-block">
                  <img src="assets/img/ikaisoft-logo.png" alt="Ikaisoft Logo" onerror="this.src='https://ikaisoft.com/assets/img/ikaisoft-logo.png'">
                  <div class="brand">
                    <p class="brand-title">Ikaisoft</p>
                    <p class="brand-subtitle">Consultancy Services</p>
                  </div>
                </div>
                <div class="certificate-title-box">
                  <div class="cert-badge-verified">
                    <i class="fa-solid fa-circle-check"></i> Verified Authenticity
                  </div>
                  <h3 class="certificate-title">Certificate of Completion</h3>
                </div>
              </div>

              <div class="certificate-body">
                <div class="recipient-section">
                  <p class="pre-title">This is proudly presented and certified to</p>
                  <h1>${escapeHTML(current.studentName)}</h1>
                  <p class="post-title">
                    For successfully fulfilling all academic & practical requirements in the <strong>${escapeHTML(current.courseName)}</strong> training program conducted in association with <strong>${escapeHTML(current.college || 'Ikaisoft')}</strong>.
                  </p>
                </div>

                <div class="details-grid">
                  <div class="detail-card">
                    <label><i class="fa-solid fa-barcode"></i> Certificate Number</label>
                    <p class="value">${escapeHTML(current.certificateNumber)}</p>
                  </div>
                  <div class="detail-card">
                    <label><i class="fa-solid fa-calendar-check"></i> Issue Date</label>
                    <p class="value">${formatDate(current.issuedDate || current.createdAt)}</p>
                  </div>
                  <div class="detail-card">
                    <label><i class="fa-solid fa-flag-checkered"></i> Completion Date</label>
                    <p class="value">${formatDate(current.completionDate || current.issuedDate || current.createdAt)}</p>
                  </div>
                  <div class="certificate-qr-card">
                    <img 
                      src="${escapeHTML(qrUrl)}" 
                      alt="Certificate QR Code"
                      onerror="this.onerror=null;this.src='https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=https%3A%2F%2Fikaisoft.com%2Fcertificate';"
                    >
                    <div class="qr-info">
                      <p>Official QR Verification</p>
                      <span>Scan anytime to verify at /certificate</span>
                    </div>
                  </div>
                </div>
              </div>

              <div class="certificate-footer">
                <div class="security-note">
                  <i class="fa-solid fa-shield-check" style="font-size:18px; color:var(--primary);"></i>
                  <span>Digitally verified credential issued by Ikaisoft Consultancy Services. Student identity verified via registered email (<strong>${escapeHTML(verifiedEmail)}</strong>).</span>
                </div>
                <div class="actions">
                  <button class="button secondary" id="reverifyBtn">
                    <i class="fa-solid fa-arrow-left"></i> Verify Another
                  </button>
                  <button class="button secondary" id="printBtn">
                    <i class="fa-solid fa-print"></i> Print
                  </button>
                  <button class="button primary" id="downloadBtn">
                    <i class="fa-solid fa-download"></i> Download PDF
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      `;

      // Event Listeners for actions
      document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!downloadUrl) return;
        window.location.href = downloadUrl;
      });

      document.getElementById('printBtn').addEventListener('click', () => {
        window.print();
      });

      document.getElementById('reverifyBtn').addEventListener('click', () => {
        verifiedCertificates = [];
        renderVerificationScreen();
      });

      // Switch multi-certificates
      document.querySelectorAll('.cert-tab-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = Number(btn.getAttribute('data-index'));
          if (!isNaN(idx) && verifiedCertificates[idx]) {
            currentCertificateIndex = idx;
            renderCertificateDashboard();
          }
        });
      });
    }

    // Initialize: if email is already provided in URL (e.g. query param ?id=...&email=...), auto-verify
    if (certificateNumberParam && emailParam) {
      renderVerificationScreen();
      verifyAndLoadCertificate(certificateNumberParam, emailParam);
    } else {
      renderVerificationScreen();
    }
  </script>
</body>
</html>
