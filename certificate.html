<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Certificate Preview</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f3f7f3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at top, #eef7ee, #f3f7f3 40%, #dbe7d9 100%);
    }
    #certificate-root {
      width: min(100%, 1080px);
      padding: 24px;
    }
    .certificate-card {
      background: white;
      border: 1px solid #d4e5d3;
      border-radius: 28px;
      box-shadow: 0 40px 80px rgba(15, 31, 17, 0.12);
      overflow: hidden;
    }
    .certificate-inner {
      padding: 42px 44px 34px;
      display: grid;
      gap: 32px;
    }
    .certificate-header {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
    }
    .logo-block {
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .logo-block img {
      width: 72px;
      height: 72px;
      object-fit: contain;
      border-radius: 18px;
      background: #eef6ec;
      padding: 12px;
    }
    .logo-block .brand {
      display: grid;
      gap: 6px;
    }
    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #0f2a18;
      margin: 0;
    }
    .brand-subtitle {
      margin: 0;
      color: #4b5f52;
      font-size: 13px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .certificate-title {
      text-align: right;
      font-size: 18px;
      color: #4a5f52;
      text-transform: uppercase;
      letter-spacing: 0.23em;
      line-height: 1.4;
    }
    .certificate-body {
      display: grid;
      gap: 28px;
      padding: 34px 0 0;
    }
    .certificate-body h1 {
      margin: 0;
      font-size: clamp(3.2rem, 4vw, 4.8rem);
      line-height: 0.94;
      letter-spacing: -0.04em;
      color: #163c20;
    }
    .subtitle {
      margin: 0;
      font-size: 1rem;
      color: #546a5a;
      opacity: 0.86;
      max-width: 720px;
      line-height: 1.8;
    }
    .details-grid {
      display: grid;
      gap: 18px;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
    }
    .detail-card {
      background: #f7faf6;
      padding: 20px 22px;
      border-radius: 20px;
      border: 1px solid #e2efe4;
    }
    .detail-card label {
      display: block;
      font-size: 12px;
      text-transform: uppercase;
      color: #60735e;
      letter-spacing: 0.18em;
      margin-bottom: 8px;
    }
    .detail-card .value {
      margin: 0;
      font-size: 1.1rem;
      color: #17321c;
      font-weight: 600;
      line-height: 1.45;
    }
    .certificate-meta {
      display: grid;
      gap: 8px;
      grid-template-columns: 1fr auto;
      align-items: center;
    }
    .certificate-meta .small-note {
      color: #6b796d;
      font-size: 0.95rem;
      line-height: 1.7;
    }
    .certificate-qr {
      display: grid;
      gap: 14px;
      justify-items: center;
      text-align: center;
    }
    .certificate-qr img {
      width: 156px;
      height: 156px;
      border-radius: 20px;
      border: 1px solid #dfe8dc;
      background: white;
      padding: 10px;
    }
    .certificate-qr p {
      margin: 0;
      font-size: 0.9rem;
      color: #4d6154;
      line-height: 1.5;
    }
    .actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      flex-wrap: wrap;
      padding-top: 12px;
      border-top: 1px solid #e5eee3;
    }
    .button {
      border: none;
      border-radius: 16px;
      padding: 14px 24px;
      font-size: 0.98rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .button:hover { transform: translateY(-1px); }
    .button.primary {
      background: #144a21;
      color: white;
      box-shadow: 0 20px 32px rgba(20, 74, 33, 0.18);
    }
    .button.secondary {
      background: #f4f7f4;
      color: #235433;
      box-shadow: 0 16px 28px rgba(37, 84, 51, 0.08);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="certificate-root"></div>
  <script type="module">
    const params = new URLSearchParams(window.location.search);
    const certificateNumber = params.get('id');
    const root = document.getElementById('certificate-root');

    function escapeHTML(value) {
      return String(value || '').replace(/[&<>'"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;' })[c]);
    }

    function renderError(message) {
      root.innerHTML = `<div style="padding:48px; text-align:center; max-width:620px; margin:0 auto; color:#274132;"><h1 style="font-size:2.6rem; margin-bottom:18px;">Unable to load certificate</h1><p style="font-size:1rem; color:#4f6a5d;">${escapeHTML(message)}</p></div>`;
    }

    function formatDate(value) {
      if (!value) return 'N/A';
      const date = new Date(value);
      return new Intl.DateTimeFormat('en-GB', { day:'2-digit', month:'long', year:'numeric' }).format(date);
    }

    function renderCertificate(data) {
      const qrUrl = data.qrCodeUrl || `${API_BASE}/api/certificate/${encodeURIComponent(data.certificateNumber)}/qr`;
      const downloadUrl = data.pdfUrl || '';
      root.innerHTML = `
        <div class="certificate-card">
          <div class="certificate-inner">
            <div class="certificate-header">
              <div class="logo-block">
                <img src="/assets/img/ikaisoft-logo.png" alt="Ikaisoft Logo" onerror="this.src='https://ikaisoft.com/assets/img/ikaisoft-logo.png'">
                <div class="brand">
                  <p class="brand-title">Ikaisoft</p>
                  <p class="brand-subtitle">Consultancy Services</p>
                </div>
              </div>
              <div class="certificate-title">Certificate of Completion</div>
            </div>

            <div class="certificate-body">
              <div>
                <p class="subtitle">This certificate is awarded to the student named below upon successful completion of the course listed.</p>
                <h1>${escapeHTML(data.studentName)}</h1>
                <p class="subtitle" style="margin-top:8px;">For successfully completing the <strong>${escapeHTML(data.courseName)}</strong> program at <strong>${escapeHTML(data.college)}</strong>.</p>
              </div>

              <div class="details-grid">
                <div class="detail-card">
                  <label>Certificate Number</label>
                  <p class="value">${escapeHTML(data.certificateNumber)}</p>
                </div>
                <div class="detail-card">
                  <label>Issue Date</label>
                  <p class="value">${formatDate(data.issuedDate || data.createdAt)}</p>
                </div>
                <div class="detail-card">
                  <label>Completion Date</label>
                  <p class="value">${formatDate(data.completionDate || data.issuedDate || data.createdAt)}</p>
                </div>
                <div class="certificate-qr">
                  <img src="${escapeHTML(qrUrl)}" alt="Certificate QR Code">
                  <p>Scan to verify certification</p>
                </div>
              </div>
            </div>

            <div class="certificate-meta">
              <p class="small-note">This certificate is digitally issued and verified by Ikaisoft Consultancy Services. The QR code contains the official verification link.</p>
              <div class="actions">
                <button class="button secondary" id="printBtn">Print</button>
                <button class="button primary" id="downloadBtn">Download PDF</button>
              </div>
            </div>
          </div>
        </div>
      `;

      document.getElementById('downloadBtn').addEventListener('click', () => {
        if (!downloadUrl) return;
        window.location.href = downloadUrl;
      });
      document.getElementById('printBtn').addEventListener('click', () => {
        window.print();
      });
    }

    const API_BASE = window.location.hostname === 'ikaisoft.com' || window.location.hostname === 'www.ikaisoft.com'
      ? 'https://api.ikaisoft.com'
      : window.location.origin;

    async function fetchCertificate() {
      if (!certificateNumber) {
        return renderError('Certificate ID is missing.');
      }
      try {
        const resp = await fetch(`${API_BASE}/api/certificate/${encodeURIComponent(certificateNumber)}`);
        if (!resp.ok) {
          const body = await resp.json().catch(() => ({}));
          return renderError(body.message || 'Certificate not found.');
        }
        const result = await resp.json();
        if (!result.success || !result.data) {
          return renderError(result.message || 'Unable to load certificate details.');
        }
        renderCertificate(result.data);
      } catch (err) {
        renderError('Server error loading certificate.');
      }
    }

    fetchCertificate();
  </script>
</body>
</html>
